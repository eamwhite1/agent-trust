<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="canonical" href="https://agenttrustxrpl.com/rate.html" />
<title>Rate Transaction — AgentTrust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e8eaf0;
    --text-muted: #8b8fa8;
    --blue: #5b8af5;
    --amber: #f5a623;
    --green: #4caf82;
    --red: #e05c5c;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8;
      --surface: #ffffff;
      --border: #dde0ea;
      --text: #1a1d27;
      --text-muted: #6b7280;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2rem 1rem 4rem;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--text);
    margin-bottom: 2rem;
    text-decoration: none;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 440px;
  }
  .card-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: .25rem;
  }
  .card-sub {
    font-size: .85rem;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
  }
  .stars {
    display: flex;
    gap: .5rem;
    margin-bottom: 1.25rem;
    justify-content: center;
  }
  .star {
    font-size: 2.2rem;
    cursor: pointer;
    color: var(--border);
    transition: color .15s, transform .1s;
    line-height: 1;
    user-select: none;
  }
  .star.active { color: var(--amber); }
  .star:hover { transform: scale(1.15); }
  .star-label {
    text-align: center;
    font-size: .82rem;
    color: var(--text-muted);
    min-height: 1.2em;
    margin-bottom: 1.25rem;
  }
  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: .85rem;
    padding: .6rem .75rem;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color .15s;
  }
  textarea:focus { border-color: var(--blue); }
  .char-count {
    text-align: right;
    font-size: .75rem;
    color: var(--text-muted);
    margin-top: .25rem;
    margin-bottom: 1.25rem;
  }
  .char-count.over { color: var(--red); }
  button.submit {
    width: 100%;
    padding: .75rem;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button.submit:disabled { opacity: .5; cursor: default; }
  .msg {
    text-align: center;
    font-size: .9rem;
    margin-top: 1rem;
    min-height: 1.4em;
  }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }
  .rated-address {
    font-size: .82rem;
    color: var(--text-muted);
    font-family: monospace;
    word-break: break-all;
    margin-bottom: 1.5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .35rem .6rem;
  }
  .already-rated {
    text-align: center;
    color: var(--green);
    font-size: .95rem;
    padding: 1rem 0;
  }
  .loading { text-align: center; color: var(--text-muted); padding: 1.5rem 0; }
  .thank-you { text-align: center; }
  .thank-you .big { font-size: 2.5rem; margin-bottom: .5rem; }
  .thank-you .title { font-size: 1.1rem; font-weight: 600; margin-bottom: .5rem; }
  .thank-you .sub { font-size: .85rem; color: var(--text-muted); }
</style>
</head>
<body>
<a class="logo" href="/">AgentTrust</a>
<div class="card" id="card">
  <div class="loading" id="loading">Verifying link…</div>
</div>

<script>
const API = 'https://mcp.cryptovault.co.uk';
const LABELS = ['','Terrible','Poor','OK','Good','Excellent'];
let selectedRating = 0;
let info = null;

const token = new URLSearchParams(location.search).get('token') || '';

async function init() {
  if (!token) { showError('No rating link provided.'); return; }
  try {
    const res = await fetch(`${API}/rate/verify?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) { showError(data.detail || 'Invalid or expired link.'); return; }
    info = data;
    if (data.already_rated) { showAlreadyRated(data); return; }
    renderForm(data);
  } catch {
    showError('Could not connect to AgentTrust. Please try again later.');
  }
}

function showError(msg) {
  document.getElementById('card').innerHTML = `
    <div class="card-title" style="color:var(--red)">Link problem</div>
    <div class="card-sub">${escHtml(msg)}</div>`;
}

function showAlreadyRated(data) {
  document.getElementById('card').innerHTML = `
    <div class="already-rated">
      <div style="font-size:2rem;margin-bottom:.5rem">✓</div>
      <div class="card-title">Already rated</div>
      <div class="card-sub" style="margin-top:.5rem">You have already submitted a rating for <strong>${escHtml(data.project_label)}</strong>. Thank you!</div>
    </div>`;
}

function renderForm(data) {
  const roleLabel = data.role === 'buyer' ? 'worker' : 'buyer';
  document.getElementById('card').innerHTML = `
    <div class="card-title">Rate this transaction</div>
    <div class="card-sub">How did the ${escHtml(roleLabel)} perform on <strong>${escHtml(data.project_label)}</strong>?</div>
    <div class="rated-address">${escHtml(data.rated_address)}</div>
    <div class="stars" id="stars">
      ${[1,2,3,4,5].map(n => `<span class="star" data-v="${n}" onclick="pickStar(${n})" onmouseenter="hoverStar(${n})" onmouseleave="unhoverStar()">★</span>`).join('')}
    </div>
    <div class="star-label" id="star-label"></div>
    <textarea id="comment" placeholder="Optional comment (280 chars)" maxlength="280" oninput="updateCharCount()"></textarea>
    <div class="char-count" id="char-count">0 / 280</div>
    <button class="submit" id="submit-btn" disabled onclick="submitRating()">Submit rating</button>
    <div class="msg" id="msg"></div>`;
}

function pickStar(n) {
  selectedRating = n;
  paintStars(n);
  document.getElementById('star-label').textContent = LABELS[n];
  document.getElementById('submit-btn').disabled = false;
}

function hoverStar(n) { paintStars(n); document.getElementById('star-label').textContent = LABELS[n]; }
function unhoverStar() { paintStars(selectedRating); document.getElementById('star-label').textContent = selectedRating ? LABELS[selectedRating] : ''; }

function paintStars(n) {
  document.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('active', +s.dataset.v <= n);
  });
}

function updateCharCount() {
  const len = document.getElementById('comment').value.length;
  const el = document.getElementById('char-count');
  el.textContent = `${len} / 280`;
  el.classList.toggle('over', len > 280);
}

async function submitRating() {
  if (!selectedRating) return;
  const comment = document.getElementById('comment').value.trim();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = '';
  msg.className = 'msg';
  try {
    const params = new URLSearchParams({ token, rating: selectedRating });
    if (comment) params.set('comment', comment);
    const res = await fetch(`${API}/rate/submit?${params}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.detail || 'Error submitting rating.'; msg.className = 'msg err'; btn.disabled = false; return; }
    showThankYou();
  } catch {
    msg.textContent = 'Network error. Please try again.';
    msg.className = 'msg err';
    btn.disabled = false;
  }
}

function showThankYou() {
  document.getElementById('card').innerHTML = `
    <div class="thank-you">
      <div class="big">🌟</div>
      <div class="title">Thank you for rating!</div>
      <div class="sub">Your feedback helps build trust in the AgentTrust network.</div>
    </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
