name: Wording check
on: [push, pull_request]
jobs:
  check-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No score>=25 / 3-free-audits / free-standalone / JS template leaks
        run: |
          hits=$(grep -rniE \
            "score (≥|>=|&ge;) ?25|3 free audits|free standalone|standalone audit[^.]*free|score (≥|>=) ?\\\$\{|min_trust_score|free_audits\b|undefined free" \
            --include="*.md" --include="*.txt" --include="*.html" --include="*.js" \
            . | grep -v "\.git/" | grep -v "node_modules/" || true)
          if [ -n "$hits" ]; then
            echo "❌ Forbidden wording found:"
            echo "$hits"
            exit 1
          fi
          echo "✅ No forbidden wording found."
      - name: Canonical line present on key pages
        run: |
          CANONICAL="New agent wallets and new Pro accounts get 3 free escrows, each including the AI check."
          PAGES="fees/index.html enterprise/index.html index.html dashboard/index.html"
          MISSING=""
          for f in $PAGES; do
            if ! grep -qF "$CANONICAL" "$f"; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ Canonical free-escrow line missing from:$MISSING"
            exit 1
          fi
          echo "✅ Canonical line present on all required pages."

  fees-render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Check /fees/ renders without undefined/NaN/score>=
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.goto('https://www.cryptovault.co.uk/fees/');
            await page.waitForTimeout(4000);
            const text = await page.evaluate(() => document.body.innerText);
            await browser.close();
            const bad = ['undefined', 'NaN', 'score ≥'];
            const found = bad.filter(s => text.includes(s));
            if (found.length) {
              console.error('FAIL: /fees/ contains forbidden text: ' + found.join(', '));
              process.exit(1);
            }
            console.log('PASS: /fees/ renders correctly');
          })().catch(e => { console.error(e); process.exit(1); });
          "
