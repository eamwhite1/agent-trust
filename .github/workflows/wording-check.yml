name: Wording check
on: [push, pull_request]
jobs:
  check-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No score>=25 / 3-free-audits / free-standalone claims
        run: |
          hits=$(grep -rniE "score (≥|>=|&ge;) ?25|3 free audits|free standalone|standalone audit[^.]*free" \
            --include="*.md" --include="*.txt" --include="*.html" --include="*.js" \
            . | grep -v "\.git/" | grep -v "node_modules/" || true)
          if [ -n "$hits" ]; then
            echo "❌ Forbidden wording found:"
            echo "$hits"
            exit 1
          fi
          echo "✅ No forbidden wording found."
