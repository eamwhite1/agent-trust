name: Post-Deploy Snippet Check

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]

jobs:
  check-snippets:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run snippet checker against production
        run: python3 scripts/check_snippets.py
        env:
          AGENT_TRUST_API: https://mcp.cryptovault.co.uk
