name: Publish SDK to npm

on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm@^11.5.1
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        working-directory: sdk
        run: npm install

      - name: Verify tag matches package.json version
        working-directory: sdk
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. sdk-v2.3.0
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#sdk-v}"        # strip sdk-v prefix
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag version matches package.json: $PKG_VERSION"

      - name: Check version not already on npm
        working-directory: sdk
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "ERROR: ${PKG_NAME}@${PKG_VERSION} is already published on npm"
            exit 1
          fi
          echo "Version $PKG_VERSION not yet on npm — proceeding"

      - name: Publish to npm (OIDC Trusted Publishing)
        working-directory: sdk
        run: npm publish --access public
